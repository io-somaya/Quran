<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="50%" stop-color="#047857" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Background Circle / Rounded Box -->
  <rect width="192" height="192" rx="42" fill="url(#bgGrad)" />
  <rect x="6" y="6" width="180" height="180" rx="36" fill="none" stroke="url(#goldGrad)" stroke-width="2" stroke-opacity="0.6" />
  
  <!-- Quran Book / Islamic Star Icon -->
  <g transform="translate(96, 96)" filter="url(#glow)">
    <!-- Eight-pointed Islamic Star -->
    <rect x="-42" y="-42" width="84" height="84" rx="8" fill="none" stroke="url(#goldGrad)" stroke-width="2" stroke-opacity="0.35" />
    <rect x="-42" y="-42" width="84" height="84" rx="8" fill="none" stroke="url(#goldGrad)" stroke-width="2" stroke-opacity="0.35" transform="rotate(45)" />

    <!-- Open Quran Book -->
    <g transform="translate(-40, -32) scale(0.8)">
      <path d="M50 78 C35 68 15 68 0 72 L0 18 C15 14 35 14 50 24 C65 14 85 14 100 18 L100 72 C85 68 65 68 50 78 Z" fill="#f8fafc" />
      <path d="M50 24 L50 78" stroke="#d97706" stroke-width="3" stroke-linecap="round" />
      <!-- Book Lines -->
      <path d="M12 32 C24 30 38 31 44 35" stroke="#cbd5e1" stroke-width="2.5" stroke-linecap="round" />
      <path d="M12 44 C24 42 38 43 44 47" stroke="#cbd5e1" stroke-width="2.5" stroke-linecap="round" />
      <path d="M12 56 C24 54 38 55 44 59" stroke="#cbd5e1" stroke-width="2.5" stroke-linecap="round" />
      <path d="M56 35 C62 31 76 30 88 32" stroke="#cbd5e1" stroke-width="2.5" stroke-linecap="round" />
      <path d="M56 47 C62 43 76 42 88 44" stroke="#cbd5e1" stroke-width="2.5" stroke-linecap="round" />
      <path d="M56 59 C62 55 76 54 88 56" stroke="#cbd5e1" stroke-width="2.5" stroke-linecap="round" />
    </g>

    <!-- Star Glow on top -->
    <circle cx="0" cy="-42" r="4" fill="#fbbf24" />
  </g>
</svg>
